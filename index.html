<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geo-Rescue: Wildlife Squad</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
  #app { width: 100%; max-width: 440px; display: flex; flex-direction: column; justify-content: space-between; }
  .score-board { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; font-size: 14px; color: #94a3b8; }
  .header { text-align: center; margin-bottom: 10px; }
  .badge { display: inline-block; background: #22c55e; color: #052e16; padding: 4px 14px; border-radius: 20px; font-weight: 800; font-size: 12px; letter-spacing: 0.5px; }
  
  .card { background: #1e293b; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #334155; }
  
  /* Media & Visual Hints */
  .media-container { display: flex; gap: 10px; margin-bottom: 12px; height: 140px; }
  .animal-photo-box { flex: 1.1; position: relative; border-radius: 12px; overflow: hidden; background: #0f172a; border: 1px solid #475569; }
  .animal-photo-box img { width: 100%; height: 100%; object-fit: cover; }
  
  .map-hint-box { flex: 0.9; position: relative; border-radius: 12px; overflow: hidden; background: #0f172a; border: 1px solid #475569; }
  .map-hint-box iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .map-country-tag { position: absolute; bottom: 6px; left: 6px; right: 6px; background: rgba(15, 23, 42, 0.88); color: #38bdf8; font-size: 11px; font-weight: 700; text-align: center; padding: 3px 6px; border-radius: 6px; backdrop-filter: blur(4px); border: 1px solid rgba(56, 189, 248, 0.3); }

  .clue-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; color: #cbd5e1; margin-bottom: 14px; }
  .question-label { font-size: 14px; font-weight: 700; margin: 0 0 10px; color: #f1f5f9; }
  
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button.opt-btn { background: #334155; border: 2px solid transparent; color: white; padding: 12px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
  button.opt-btn:active { transform: scale(0.97); }
  button.opt-btn.correct { background: #15803d; border-color: #22c55e; color: #fff; }
  button.opt-btn.wrong { background: #991b1b; border-color: #ef4444; color: #fff; }
  
  #next-btn { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 14px; border-radius: 12px; width: 100%; margin-top: 14px; font-size: 15px; cursor: pointer; display: none; }
</style>
</head>
<body>
<div id="app">
  <div>
    <div class="score-board">
      <span>🐾 Rescues: <b id="score" style="color:#38bdf8">0</b></span>
      <span>Mission: <b id="round-tracker">1/4</b></span>
    </div>
    <div class="header">
      <div class="badge">URGENT SOS SIGNAL</div>
    </div>
    
    <div class="card" id="game-card">
      <h2 id="animal-name" style="margin:0 0 10px; text-align:center; font-size: 20px;">Animal Name</h2>
      
      <div class="media-container">
        <!-- Real Animal Photo -->
        <div class="animal-photo-box">
          <img id="animal-img" src="" alt="Animal">
        </div>
        <!-- Embedded Mini Map Hint -->
        <div class="map-hint-box">
          <iframe id="map-frame" src="" loading="lazy"></iframe>
          <div class="map-country-tag" id="country-tag">📍 Country</div>
        </div>
      </div>

      <div class="clue-box" id="mission-clue">Mission Clue</div>
      
      <div class="question-label" id="step-question">Step 1: Identify Location</div>
      <div class="options-grid" id="options-box"></div>
      <button id="next-btn" onclick="nextQuestion()">Next Rescue Mission ➔</button>
    </div>
  </div>
</div>

<script>
const missions = [
  {
    name: "Snow Leopard",
    country: "Nepal / India / China",
    photo: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80",
    mapEmbed: "https://maps.google.com/maps?q=Himalayas,Nepal&t=k&z=4&ie=UTF8&iwloc=&output=embed",
    clue: "Stranded across high-altitude mountain passes in <b>Nepal</b>, <b>India</b>, and <b>China</b>.",
    locationQ: "Identify the mountain biome:",
    locations: ["Himalayas", "Andes", "Alps", "Rockies"],
    correctLoc: 0,
    gearQ: "Pack proper gear for sub-zero peaks:",
    gear: ["Thermal Parka & Crampons", "Scuba Fins & Tank", "Desert Sun Hat", "Jungle Machete"],
    correctGear: 0,
    fact: "Mission Success! The Himalayas contain Mount Everest and span across 5 Asian nations."
  },
  {
    name: "Ring-Tailed Lemur",
    country: "Madagascar",
    photo: "https://images.unsplash.com/photo-1579613832125-5d34a13ffe0a?auto=format&fit=crop&w=600&q=80",
    mapEmbed: "https://maps.google.com/maps?q=Madagascar&t=k&z=4&ie=UTF8&iwloc=&output=embed",
    clue: "Trapped in dry spiny forests on the island country of <b>Madagascar</b> off East Africa.",
    locationQ: "Target the destination:",
    locations: ["Madagascar", "Greenland", "Sri Lanka", "New Zealand"],
    correctLoc: 0,
    gearQ: "Select safari expedition essential:",
    gear: ["Bug Spray & Light Boots", "Heavy Snow Goggles", "Fur Winter Coat", "Ice Pick"],
    correctGear: 0,
    fact: "Awesome! Madagascar is an island nation where 90% of all wildlife exists nowhere else on Earth."
  },
  {
    name: "Galápagos Penguin",
    country: "Ecuador",
    photo: "https://images.unsplash.com/photo-1598439210625-5067c578f3f6?auto=format&fit=crop&w=600&q=80",
    mapEmbed: "https://maps.google.com/maps?q=Galapagos+Islands,Ecuador&t=k&z=5&ie=UTF8&iwloc=&output=embed",
    clue: "Living on volcanic ocean islands governed by <b>Ecuador</b>, directly on the Equator.",
    locationQ: "Pinpoint the archipelago:",
    locations: ["Galápagos Islands", "Hawaii", "Iceland", "Maldives"],
    correctLoc: 0,
    gearQ: "Gear needed for equatorial reef rescue:",
    gear: ["Snorkel & Reef Boots", "Snowmobile", "Sand Gaiters", "Down Jacket"],
    correctGear: 0,
    fact: "Brilliant! The Galápagos Islands belong to Ecuador in South America and are home to the only penguin native to the northern hemisphere."
  },
  {
    name: "Jaguar",
    country: "Brazil",
    photo: "https://images.unsplash.com/photo-1561731216-c3a4d99437d5?auto=format&fit=crop&w=600&q=80",
    mapEmbed: "https://maps.google.com/maps?q=Amazon+Rainforest,Brazil&t=k&z=4&ie=UTF8&iwloc=&output=embed",
    clue: "Hiding deep in the tropical rainforest of <b>Brazil</b> along the world's largest river basin.",
    locationQ: "Select the river basin:",
    locations: ["Amazon Basin", "Nile River", "Danube River", "Yangtze River"],
    correctLoc: 0,
    gearQ: "Choose river expedition gear:",
    gear: ["Waterproof Raft & Compass", "Ice Sled", "Snowshoes", "Camel Saddle"],
    correctGear: 0,
    fact: "Great rescue! The Amazon Basin covers roughly 40% of South America, with the largest portion located in Brazil."
  }
];

let currentIdx = 0;
let step = 0;
let score = 0;

function loadMission() {
  const m = missions[currentIdx];
  document.getElementById("animal-name").innerText = m.name;
  document.getElementById("animal-img").src = m.photo;
  document.getElementById("map-frame").src = m.mapEmbed;
  document.getElementById("country-tag").innerText = `📍 ${m.country}`;
  document.getElementById("mission-clue").innerHTML = m.clue;
  document.getElementById("round-tracker").innerText = `${currentIdx + 1}/${missions.length}`;
  document.getElementById("next-btn").style.display = "none";
  step = 0;
  renderStep();
}

function renderStep() {
  const m = missions[currentIdx];
  const box = document.getElementById("options-box");
  box.innerHTML = "";
  
  if (step === 0) {
    document.getElementById("step-question").innerText = `Step 1: ${m.locationQ}`;
    m.locations.forEach((loc, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = loc;
      btn.onclick = () => checkAnswer(i, m.correctLoc, btn);
      box.appendChild(btn);
    });
  } else {
    document.getElementById("step-question").innerText = `Step 2: ${m.gearQ}`;
    m.gear.forEach((g, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = g;
      btn.onclick = () => checkGearAnswer(i, m.correctGear, btn);
      box.appendChild(btn);
    });
  }
}

function checkAnswer(chosen, correct, btn) {
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.classList.add("correct");
    setTimeout(() => { step = 1; renderStep(); }, 600);
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
    setTimeout(() => { step = 1; renderStep(); }, 1200);
  }
}

function checkGearAnswer(chosen, correct, btn) {
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.classList.add("correct");
    score += 100;
    document.getElementById("score").innerText = score;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }
  document.getElementById("mission-clue").innerHTML = `🎉 <b>Mission Accomplished!</b><br>${missions[currentIdx].fact}`;
  document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < missions.length) {
    loadMission();
  } else {
    document.getElementById("game-card").innerHTML = `
      <div style="text-align:center; padding: 20px 10px;">
        <div style="font-size: 56px; margin-bottom:10px;">🏆</div>
        <h2 style="margin:0 0 8px;">Master Wildlife Explorer!</h2>
        <p style="color:#cbd5e1; font-size:14px;">All endangered wildlife successfully rescued across the globe!</p>
        <p style="font-size:18px; margin: 16px 0;">Final Score: <b style="color:#22c55e">${score} pts</b></p>
        <button class="opt-btn" onclick="location.reload()" style="width:100%; background:#38bdf8; color:#0f172a; font-weight:800; font-size:15px; margin-top:10px;">Play Again 🔄</button>
      </div>`;
  }
}

loadMission();
</script>
</body>
</html>
