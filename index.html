<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Top Panel: Dominant Photo, Mission Brief, and Options */
  #top-panel {
    flex: 0 0 74%;
    padding: 12px 14px;
    background: #1e293b;
    border-bottom: 2px solid #334155;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  
  .score-board { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
  
  .mission-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .badge { display: inline-block; background: #22c55e; color: #052e16; padding: 2px 8px; border-radius: 12px; font-weight: 800; font-size: 10px; }
  .animal-title { font-size: 17px; font-weight: 700; color: #f8fafc; margin-top: 2px; }

  /* Large Featured Animal Photo */
  .large-photo-box {
    width: 100%;
    height: 155px;
    border-radius: 10px;
    overflow: hidden;
    background: #0f172a;
    border: 1px solid #475569;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .large-photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .clue-box { background: #0f172a; border-left: 3px solid #38bdf8; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.35; color: #cbd5e1; margin-bottom: 8px; }
  .question-label { font-size: 12.5px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }

  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button.opt-btn { background: #334155; border: 1.5px solid transparent; color: white; padding: 9px 6px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s; }
  button.opt-btn:active { transform: scale(0.97); }
  button.opt-btn.correct { background: #15803d; border-color: #22c55e; color: #fff; }
  button.opt-btn.wrong { background: #991b1b; border-color: #ef4444; color: #fff; }

  #next-btn { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 8px; font-size: 14px; cursor: pointer; display: none; }

  /* Compact Bottom Map Panel */
  #bottom-map-panel {
    flex: 1;
    position: relative;
    background: #020617;
  }
  
  #bottom-map-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .map-country-badge {
    position: absolute;
    top: 8px;
    left: 10px;
    background: rgba(15, 23, 42, 0.92);
    color: #38bdf8;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 8px;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(56, 189, 248, 0.4);
    z-index: 10;
    pointer-events: none;

// Shuffle algorithm (Fisher-Yates) for random gameplay
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

let missions = shuffle([...missionsDatabase]);
let currentIdx = 0;
let step = 0;
let score = 0;

function loadMission() {
  const m = missions[currentIdx];
  document.getElementById("animal-name").innerText = m.name;
  document.getElementById("animal-img").src = m.photo;
  document.getElementById("map-frame").src = m.mapEmbed;
  document.getElementById("country-tag").innerText = `📍 ${m.country}`;
  document.getElementById("mission-clue").innerHTML = m.clue;
  document.getElementById("round-tracker").innerText = `${currentIdx + 1}/${missions.length}`;
  document.getElementById("next-btn").style.display = "none";
  step = 0;
  renderStep();
}

function renderStep() {
  const m = missions[currentIdx];
  const box = document.getElementById("options-box");
  box.innerHTML = "";
  
  if (step === 0) {
    document.getElementById("step-question").innerText = `Step 1: ${m.locationQ}`;
    m.locations.forEach((loc, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = loc;
      btn.onclick = () => checkAnswer(i, m.correctLoc, btn);
      box.appendChild(btn);
    });
  } else {
    document.getElementById("step-question").innerText = `Step 2: ${m.gearQ}`;
    m.gear.forEach((g, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = g;
      btn.onclick = () => checkGearAnswer(i, m.correctGear, btn);
      box.appendChild(btn);
    });
  }
}

function checkAnswer(chosen, correct, btn) {
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.classList.add("correct");
    setTimeout(() => { step = 1; renderStep(); }, 500);
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
    setTimeout(() => { step = 1; renderStep(); }, 1200);
  }
}

function checkGearAnswer(chosen, correct, btn) {
  const buttons = document.querySelectorAll(".opt-btn");
  buttons.forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.classList.add("correct");
    score += 100;
    document.getElementById("score").innerText = score;
  } else {
    btn.classList.add("wrong");
    buttons[correct].classList.add("correct");
  }
  document.getElementById("mission-clue").innerHTML = `🎉 <b>Mission Accomplished!</b><br>${missions[currentIdx].fact}`;
  document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < missions.length) {
    loadMission();
  } else {
    document.getElementById("top-panel").innerHTML = `
      <div style="text-align:center; padding: 30px 10px;">
        <div style="font-size: 52px; margin-bottom:10px;">🏆</div>
        <h2 style="margin:0 0 8px;">Legendary Explorer!</h2>
        <p style="color:#cbd5e1; font-size:13px;">You successfully completed all 20 global rescue missions!</p>
        <p style="font-size:18px; margin: 16px 0;">Final Score: <b style="color:#22c55e">${score} pts</b></p>
        <button class="opt-btn" onclick="location.reload()" style="width:100%; background:#38bdf8; color:#0f172a; font-weight:800; font-size:14px; padding:12px;">Play Again 🔄</button>
      </div>`;
  }
}

loadMission();
</script>
</body>
</html>
